<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--navy:#1F3864;--blue:#2E75B6;--bg:#f4f6fa;--card:#fff;--text:#1a1a1a;--muted:#6b7280}
  @media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--navy:#93c5fd}}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
  header{background:#1F3864;color:#fff;padding:24px 32px;font-size:22px;font-weight:bold}
  main{max-width:1200px;margin:0 auto;padding:24px 16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
  .card{background:var(--card);border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .kpi .label{color:var(--muted);font-size:14px}
  .kpi .value{color:var(--navy);font-size:32px;font-weight:bold;margin-top:6px}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .charts .wide{grid-column:1/-1}
  .box{position:relative;height:300px}
  h2{font-size:16px;margin:0 0 12px;color:var(--navy)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
</head>
<body>
<header>Sales Dashboard &mdash; 2025 (Sample)</header>
<main>
  <section class="kpis">
    <div class="card kpi"><div class="label">Total Revenue</div><div class="value" id="rev"></div></div>
    <div class="card kpi"><div class="label">Total Orders</div><div class="value" id="ord"></div></div>
    <div class="card kpi"><div class="label">Average Order Value</div><div class="value" id="aov"></div></div>
  </section>
  <section class="charts">
    <div class="card wide"><h2>Monthly Sales Trend</h2><div class="box"><canvas id="monthly"></canvas></div></div>
    <div class="card"><h2>Top 5 Products</h2><div class="box"><canvas id="top5"></canvas></div></div>
    <div class="card"><h2>Sales by Category</h2><div class="box"><canvas id="cats"></canvas></div></div>
  </section>
</main>
<footer>Sample data. Replace the DATA array in index.html with your own orders.</footer>

// product -> [category, unit price]
const PRODUCTS = {
  "Laptop":["Electronics",950],"Smartphone":["Electronics",620],"Headphones":["Electronics",85],
  "Office Chair":["Furniture",180],"Desk":["Furniture",260],"Bookshelf":["Furniture",140],
  "Notebook Pack":["Stationery",12],"Pen Set":["Stationery",9],
  "Backpack":["Accessories",45],"Watch":["Accessories",120]
};

const money = n => "$" + Math.round(n).toLocaleString("en-US");
const orders = DATA.map(([id, date, product, qty]) => ({
  id, month: +date.slice(5,7) - 1, product, category: PRODUCTS[product][0], revenue: qty * PRODUCTS[product][1]
}));

const total = orders.reduce((s,o)=>s+o.revenue,0);
document.getElementById("rev").textContent = money(total);
document.getElementById("ord").textContent = orders.length.toLocaleString("en-US");
document.getElementById("aov").textContent = "$" + (total/orders.length).toFixed(2);

const sumBy = key => orders.reduce((m,o)=>(m[o[key]]=(m[o[key]]||0)+o.revenue,m),{});
const monthly = Array(12).fill(0); orders.forEach(o=>monthly[o.month]+=o.revenue);
const top5 = Object.entries(sumBy("product")).sort((a,b)=>b[1]-a[1]).slice(0,5);
const cats = Object.entries(sumBy("category")).sort((a,b)=>b[1]-a[1]);

const opts = {responsive:true,maintainAspectRatio:false};
const axisMoney = {ticks:{callback:v=>money(v)}};
new Chart("monthly",{type:"line",
  data:{labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
        datasets:[{data:monthly,borderColor:"#2E75B6",backgroundColor:"rgba(46,117,182,.15)",fill:true,tension:.3}]},
  options:{...opts,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money(c.parsed.y)}}},scales:{y:axisMoney}}});
new Chart("top5",{type:"bar",
  data:{labels:top5.map(x=>x[0]),datasets:[{data:top5.map(x=>x[1]),backgroundColor:"#2E75B6"}]},
  options:{...opts,indexAxis:"y",plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money(c.parsed.x)}}},scales:{x:axisMoney}}});
new Chart("cats",{type:"doughnut",
